# Requires the marble RX0 high-rate backend, S24_LE container fix and MM2 topology.
# Override the distribution's S16/48 phone rule only for wired headphones.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.platform-sound.HiFi__Headphones__sink" }
    ]
    actions = {
      update-props = {
        audio.format = "S24_32LE"
        audio.rate = 192000
        node.force-rate = 192000
      }
    }
  }
]
