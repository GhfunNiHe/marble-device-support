# Based on marble-device-support's HiFi.conf, not the device-local profile.
SectionVerb {
	Value {
		TQ "HiFi"
	}
	EnableSequence [
		# Route frontends before PipeWire probes the playback/capture PCMs.
		cset "name='TERTIARY_TDM_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='Speaker Top Profile Set' Music"
		cset "name='Speaker Bottom Profile Set' Music"
		# Preserve the installed speaker headroom; no speaker protection exists.
		cset "name='Speaker Top PCM Playback Volume' 235"
		cset "name='Speaker Bottom PCM Playback Volume' 235"
		# Start headphone bring-up at conservative analog gain (-21 dB).
		cset "name='HPHL Volume' 6"
		cset "name='HPHR Volume' 6"
		cset "name='RX_RX0 Digital Volume' 84"
		cset "name='RX_RX1 Digital Volume' 84"
		# Codec companders are disabled by the shared headphone sequence.
		cset "name='RX_COMP1 Switch' 0"
		cset "name='RX_COMP2 Switch' 0"
	]
}

SectionDevice."Speaker" {
	Comment "Speaker playback"
	ConflictingDevice [ "Headphones" ]
	EnableSequence [
		cset "name='Speaker Top Playback Switch' 1"
		cset "name='Speaker Bottom Playback Switch' 1"
	]
	DisableSequence [
		cset "name='Speaker Top Playback Switch' 0"
		cset "name='Speaker Bottom Playback Switch' 0"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Headphones" {
	Comment "3.5 mm headphones"
	ConflictingDevice [ "Speaker" ]
	Include.wcdhpe.File "/codecs/wcd938x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd938x/HeadphoneDisableSeq.conf"
	Include.rxhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackChannels 2
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic" {
	Comment "Bottom microphone"
	ConflictingDevice [ "Headset" ]
	# WCD9385 ADC1 -> SoundWire TX -> DEC0 -> TX_CODEC_DMA_TX_3.
	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='DEC0 MODE' ADC_DEFAULT"
		cset "name='TX_DEC0 Volume' 84"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1 Volume' 10"
		cset "name='TX0 MODE' ADC_NORMAL"
	]
	DisableSequence [
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='TX0 MODE' ADC_INVALID"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
	}
}

SectionDevice."Headset" {
	Comment "3.5 mm headset microphone"
	ConflictingDevice [ "Mic" ]
	# Keep the DSP on DEC0; select codec ADC2 through SWR_MIC1 instead.
	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='DEC0 MODE' ADC_DEFAULT"
		cset "name='TX_DEC0 Volume' 84"
		cset "name='ADC2 MUX' INP2"
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='ADC2 Switch' 1"
		cset "name='ADC2 Volume' 10"
		cset "name='TX1 MODE' ADC_NORMAL"
	]
	DisableSequence [
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='ADC2 Switch' 0"
		cset "name='TX1 MODE' ADC_INVALID"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
	]
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
		JackControl "Mic Jack"
	}
}
